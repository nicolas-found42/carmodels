name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check (tools/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ruff
      - name: Provision pinned Blender for the dealership roundtrip
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "CARMODELS_BLENDER=$RUNNER_TEMP/blender-4.5.14-linux-x64/blender" >> "$GITHUB_ENV"
      - run: tools/check.sh --evidence-dir .scratch/ci-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-evidence
          path: .scratch/ci-checks
          include-hidden-files: true

name: Feature request
description: Suggest an improvement to browsing, editing, exporting, or working with the library.
title: "[Feature]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/nicolas-found42/carmodels/issues) first.
        Use **Bug report** for broken behavior and **Model or recovery request** for missing cars,
        new games, or native-data research. Describe your current workflow; a feature that does
        not exist does not need invented reproduction steps.

  - type: dropdown
    id: area
    attributes:
      label: Which part would improve?
      options:
        - Dealership / live showroom
        - Recovered source inspector
        - GT comparison / ledger / refinement pages
        - Model downloads / Blender editing
        - Search / filters / catalog
        - Extraction / conversion / verification tools
        - Documentation / accessibility / other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem and current workflow
      description: What are you trying to do, how do you do it today, and where does it become difficult? Include any workaround.
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: What should a user be able to see or do? Mention the affected page/tool and game/car if relevant; distinguish source originals from editable dealership copies.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: Give a specific scenario and its desired result. Label any proposed UI or command as a proposal.
      placeholder: When comparing a GT1 car with its GT4 counterpart, I want to save both selected views so I can return to the same comparison later. Proposed behavior, not an existing feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: What other approach or workaround could help? What can stay out of scope? Include constraints on offline use, source preservation, or edited models if relevant.

  - type: textarea
    id: evidence
    attributes:
      label: Supporting references (optional)
      description: Link related issues, research notes, or examples. Screenshots of current friction help; mark design mockups as proposals. State any uncertainty. Do not include private inputs or API keys.

  - type: textarea
    id: acceptance
    attributes:
      label: Success criteria
      description: How would you tell that this solves the problem? Use observable outcomes rather than implementation instructions; no need to choose verifier commands.
      placeholder: |
        - [ ] I can return to the same pair of cars and selected views from a saved link.
        - [ ] Opening the link does not change either stored model.
    validations:
      required: true

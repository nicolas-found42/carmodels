name: Bug report
description: Report a problem with the showroom, a recovered car, a download, or the tools.
title: "[Bug]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/nicolas-found42/carmodels/issues) first.
        Describe what you observed; **Unknown** is fine when you cannot determine a detail.
        You do not need to run the recovery tools to report a showroom problem.

        Keep disc images, executable dumps, private inputs, and API keys out of the issue.
        Attach only the relevant screenshots or small, redacted logs.

  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Dealership / live showroom
        - Recovered source inspector
        - GT comparison / ledger / refinement pages
        - Model or native download / Blender editing
        - Local library search
        - Extraction / conversion / verification tools
        - Documentation / other / unsure
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Page URL or command
      description: Copy the affected page URL or exact command. For a local page, include the HTML filename.
      placeholder: https://nicolas-found42.github.io/carmodels/dealership.html
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Game, car, and selected variant (if applicable)
      description: Include the game plus car name/code, paint preset, and Original/Enhanced setting if relevant. A code alone may identify cars in different games.
      placeholder: Gran Turismo 4 — car name/code — factory preset — Enhanced GT4 edition on

  - type: textarea
    id: environment
    attributes:
      label: How are you using the project?
      description: Browser/version and OS/device; live site, local static server, or tools/serve_library.py. Include the commit if known. For an edited GLB, say whether you rebuilt the display data.
      placeholder: Live showroom, Firefox on Windows 11; unedited model. Commit unknown.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Shortest numbered steps, including search/filter text, selected car and view settings, or exact commands. State whether it happens every time.
      placeholder: |
        1. Open the page above.
        2. Select the game and car named above.
        3. Choose the factory preset, then download the GLB.
        4. Open the download and describe where the problem appears.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should you be able to see or do? For fidelity reports, link a reference for the same car, game version, and view when available.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Quote error text exactly. Say whether the problem affects the preview, download, source model, or edited dealership copy.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or a small reproduction
      description: Attach genuine screenshots for visual defects, with a caption naming the car, settings, and symptom. For other failures, paste the relevant error/log. State what you have not checked; label proposed mockups clearly.

  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: What task is blocked? Does it affect other cars or games? Include a workaround or last working version if known.

  - type: textarea
    id: acceptance
    attributes:
      label: Success criteria (optional)
      description: If you can, add unchecked, observable pass/fail conditions for the fix and adjacent behavior. Maintainers can help refine these; no need to choose an implementation or verifier command.
      placeholder: |
        - [ ] The affected car loads with the selected factory preset.
        - [ ] The downloaded GLB keeps that preset and still opens.

  - type: textarea
    id: technical
    attributes:
      label: Recovery or developer details (optional)
      description: For tool failures, include relevant runtime versions, game platform/edition/region, input path/hash, and live capture versus replay. Link receipts or check logs/results.json when available; distinguish pass, fail, skip, and not run. Separate observations from hypotheses.
      placeholder: |
        Command and commit:
        Input identity (no private file upload):
        Relevant runtime versions:
        Check command, result, and log:
        Observed facts / suspected cause / remaining unknowns:

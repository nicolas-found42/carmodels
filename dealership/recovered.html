<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car library — Source models</title>
<style>body{margin:0;background:#151a22;color:#eef2f8;font:14px system-ui}header{padding:20px 24px;background:#202833}h1{font-size:22px;margin:0 0 8px}p{max-width:960px;color:#b8c6d6;line-height:1.5;margin:8px 0}select,input,button,a{font:inherit}select,input{background:#141c28;color:white;border:1px solid #53667c;padding:8px;margin-right:12px;max-width:100%;box-sizing:border-box}label{max-width:100%;margin-right:14px;display:inline-block;padding:5px 0}a{color:#b6daff}#stage{height:calc(100vh - 250px);min-height:360px}#status{margin:10px 24px;font-size:15px;color:#eef2f8}canvas{display:block}#error{color:#ffc0b9;margin:10px 24px;padding:10px 14px;max-width:960px;border:1px solid #a3544a;border-radius:4px;background:#2a1c1c;line-height:1.5}#error:empty{display:none}@media(max-width:600px){header{padding:16px}label,select{margin-right:0}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<header><h1>Source model library</h1><p id="source-description">Browse recovered cars by game and source identity. Each model's conversion limits appear below.</p><label>Game <select id="game" aria-label="Game"></select></label><label>Find <input id="search" type="search" maxlength="500" aria-label="Find cars" placeholder="Source code or name"></label><label>Variant <select id="source-variant" aria-label="Source variant"><option value="">All variants</option></select></label><button id="interpret" type="button" title="Interpret available game and source-variant filters. Retail car names are not inferred.">Interpret search</button><span id="filter-status" role="status"></span><br><label>Car <select id="car" aria-label="Car"></select></label><label>Geometry <select id="record" aria-label="Geometry"></select></label><label>Texture variant <select id="variant" aria-label="Texture variant"></select></label><label><input type="checkbox" id="textures" checked>Textures</label><label><input type="checkbox" id="sharp" title="Nearest filtering for texel inspection; filtering fidelity varies by game.">Sharp pixels</label><label><input type="checkbox" id="wire">Wireframe</label><label><input type="checkbox" id="flip">Flip texture rows</label><button id="retry" hidden>Retry this car</button><a id="download" download title="Source GLB with exported geometry scenes and texture variants. Inspector selections and display toggles are not baked into the download.">Download source model (.glb)</a> · <a href="dealership.html">Dealership →</a></header>
<div id="stage"></div><p id="status" role="status">Loading original geometry…</p><p id="error" role="alert"></p>
<!-- Startup guard: a classic script so it still runs when the ES module below
     is blocked (opened with file://, or a fresh clone without vendor/). -->
<script>
(function(){
  var done=false;
  function fail(title,detail){if(done)return;done=true;var st=document.getElementById('status'),er=document.getElementById('error');if(st)st.textContent=title;if(er)er.textContent=detail;}
  var timer=null;
  window.__recBoot={ok:function(){done=true;if(timer)clearTimeout(timer);},fail:fail};
  function missingFile(){return 'A required file failed to load (the 3D library under vendor/, or the recovered data). Check the browser console, confirm the files exist, and serve the folder with: python3 -m http.server 8080 --directory dealership';}
  window.addEventListener('error',function(){fail('The viewer could not start.',missingFile());});
  window.addEventListener('unhandledrejection',function(){fail('The viewer could not start.',missingFile());});
  if(location.protocol==='file:'){fail('This page needs to be served, not opened from disk.','Browsers block the 3D library on the file:// scheme. From the project folder run: python3 -m http.server 8080 --directory dealership — then open http://localhost:8080/recovered.html');return;}
  timer=setTimeout(function(){fail('The model viewer did not finish starting.','A required file may be missing or a request stalled. Confirm the 3D library (vendor/) and public/models.json are present, check the browser console, and serve the folder with: python3 -m http.server 8080 --directory dealership');},5000);
})();
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';
import {fetchModel,readGLB} from './model-load.mjs';
import {createMaterial,applyMaterial} from './materials.mjs';
import {sceneLabel,geometryOptions,defaultGeometryValue} from './scene-options.mjs';
const stage=document.querySelector('#stage'), carSelect=document.querySelector('#car'), recordSelect=document.querySelector('#record'), status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#151a22');
const camera=new THREE.PerspectiveCamera(40,1,.01,2000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe8f4ff,0x3c4659,2));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(5,8,4);scene.add(key);
let loaded=null, selected=null, requestId=0, pendingRequest=null;
function disposeState(state){if(!state)return;for(const m of state.meshes){m.geometry.dispose();m.material.dispose();}for(const t of state.textures)t.dispose();for(const u of state.urls)URL.revokeObjectURL(u);for(const g of state.groups)scene.remove(g);}
function dispose(){disposeState(loaded);loaded=null;selected=null;}
function setLoading(busy){stage.setAttribute('aria-busy',String(busy));recordSelect.disabled=busy||!loaded;document.querySelector('#variant').disabled=busy||!loaded||document.querySelector('#variant').options.length===1;for(const id of ['textures','sharp','wire','flip'])document.querySelector('#'+id).disabled=busy||!loaded;}
async function loadCar(){
 const id=++requestId;pendingRequest?.abort();const controller=new AbortController();pendingRequest=controller;dispose();setLoading(true);document.querySelector('#download').removeAttribute('href');document.querySelector('#retry').hidden=true;let state=null;status.textContent='Loading '+carSelect.value+'…';document.querySelector('#error').textContent='';
 try{const entry=index.cars.find(c=>c.id===carSelect.value);const {doc,bin}=readGLB(await fetchModel(encodeURI('public/'+entry.file),controller.signal));if(id!==requestId)return;
 state={groups:[],meshes:[],textures:[],urls:[],doc};
 function values(i){const a=doc.accessors[i],v=doc.bufferViews[a.bufferView],n={SCALAR:1,VEC2:2,VEC3:3}[a.type];const Type={5121:Uint8Array,5123:Uint16Array,5125:Uint32Array,5126:Float32Array}[a.componentType];if(!Type||!n||a.sparse)throw Error('Unsupported accessor layout');const offset=(v.byteOffset||0)+(a.byteOffset||0),stride=v.byteStride||n*Type.BYTES_PER_ELEMENT;if(stride!==n*Type.BYTES_PER_ELEMENT)throw Error('Interleaved accessors are outside the source viewer profile');return new Type(bin,offset,a.count*n);}
 const loader=new THREE.TextureLoader();
 const decoded=await Promise.allSettled((doc.images||[]).map(async image=>{const v=doc.bufferViews[image.bufferView],url=URL.createObjectURL(new Blob([new Uint8Array(bin,v.byteOffset||0,v.byteLength)],{type:'image/png'}));state.urls.push(url);const texture=await loader.loadAsync(url);texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.flipY=false;return texture;}));
 state.textures=decoded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 if(id!==requestId){disposeState(state);return;}
 if(decoded.some(r=>r.status==='rejected'))throw Error('Embedded texture could not be decoded');
 loaded=state;selected=entry;
 function meshNode(node){const group=new THREE.Group();if(node.mesh===undefined)return group;for(const p of doc.meshes[node.mesh].primitives){if(p.mode!==undefined&&p.mode!==4)throw Error('Only triangle primitives are supported');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(values(p.attributes.POSITION),3));if(p.attributes.NORMAL!==undefined)geometry.setAttribute('normal',new THREE.BufferAttribute(values(p.attributes.NORMAL),3));if(p.attributes.TEXCOORD_0!==undefined)geometry.setAttribute('uv',new THREE.BufferAttribute(values(p.attributes.TEXCOORD_0),2));if(p.attributes.COLOR_0!==undefined)geometry.setAttribute('color',new THREE.BufferAttribute(values(p.attributes.COLOR_0),3));if(p.indices!==undefined)geometry.setIndex(new THREE.BufferAttribute(values(p.indices),1));if(p.attributes.NORMAL===undefined)geometry.computeVertexNormals();const source=doc.materials[p.material],pbr=source.pbrMetallicRoughness||{},material=createMaterial(doc,state.textures,p.material);material.vertexColors=p.attributes.COLOR_0!==undefined;const mesh=new THREE.Mesh(geometry,material);mesh.userData.headerColour=!pbr.baseColorTexture&&source.name?.startsWith('Header untextured ');mesh.userData.baseMaterial=p.material;mesh.userData.variantMappings=p.extensions?.KHR_materials_variants?.mappings||[];group.add(mesh);state.meshes.push(mesh);}return group;}
 for(const node of doc.nodes){if(node.extras?.assemblyCandidate||node.extras?.geometryRecord===undefined)continue;const group=meshNode(node);group.visible=false;group.userData.record=String(node.extras.geometryRecord);scene.add(group);state.groups.push(group);}
 function treeNode(index,ancestors=new Set()){if(ancestors.has(index))throw Error('Cyclic node hierarchy');const node=doc.nodes[index],base=node.extras?.geometryRecord===undefined?null:state.groups.find(g=>g.userData.record===String(node.extras.geometryRecord)),group=base?base.clone(true):meshNode(node),next=new Set([...ancestors,index]);group.visible=true;if(node.matrix){group.matrix.fromArray(node.matrix);group.matrixAutoUpdate=false;}else{group.position.fromArray(node.translation||[0,0,0]);group.quaternion.fromArray(node.rotation||[0,0,0,1]);group.scale.fromArray(node.scale||[1,1,1]);}for(const child of node.children||[])group.add(treeNode(child,next));return group;}
 const recordLayout=doc.nodes.some(n=>n.extras?.geometryRecord!==undefined);
 for(const [i,sourceScene] of doc.scenes.entries()){if(i===0&&recordLayout)continue;const tree=new THREE.Group();for(const root of sourceScene.nodes)tree.add(treeNode(root));tree.userData.record='scene'+i;tree.userData.label=sourceScene.name||`Scene ${i}`;tree.visible=false;scene.add(tree);state.groups.push(tree);}
 const options=geometryOptions(doc,entry.records);recordSelect.replaceChildren(...options.map(choice=>Object.assign(document.createElement('option'),choice)));recordSelect.value=defaultGeometryValue(doc,options);
 const variantSelect=document.querySelector('#variant');variantSelect.replaceChildren();const baseOption=document.createElement('option');baseOption.value='';baseOption.textContent='Original base entries';variantSelect.append(baseOption);for(const [i,v] of (doc.extensions?.KHR_materials_variants?.variants||[]).entries()){const o=document.createElement('option');o.value=String(i);o.textContent=v.name;variantSelect.append(o);}variantSelect.disabled=variantSelect.options.length===1;
 document.querySelector('#download').href=encodeURI('public/'+entry.file);setLoading(false);showRecord();updateDescription(entry);
 }catch(e){disposeState(state);if(id===requestId){loaded=null;selected=null;setLoading(false);document.querySelector('#download').removeAttribute('href');document.querySelector('#retry').hidden=false;status.textContent='This model could not be loaded.';document.querySelector('#error').textContent='The geometry file for '+carSelect.value.replaceAll('_',' ')+' did not load ('+e.message+'). Confirm the files exist under the game folder in public/, or try another car above.';}}
}
function updateMaterials(){if(!loaded)return;for(const m of loaded.meshes){const active=document.querySelector('#variant').value;const mapping=active===''?null:m.userData.variantMappings.find(v=>v.variants.includes(Number(active)));const materialIndex=mapping?mapping.material:m.userData.baseMaterial;applyMaterial(m.material,loaded.doc,loaded.textures,materialIndex,{textures:document.querySelector('#textures').checked,wireframe:document.querySelector('#wire').checked,sharp:document.querySelector('#sharp').checked});}for(const t of loaded.textures){t.flipY=document.querySelector('#flip').checked;t.needsUpdate=true;}}
function showRecord(){if(!loaded)return;const n=recordSelect.value;for(const g of loaded.groups)g.visible=g.userData.record===n;const group=loaded.groups.find(g=>g.visible);if(!group)return;const box=new THREE.Box3().setFromObject(group);if(box.isEmpty()){status.textContent=`${selected.code} · ${sceneLabel(group.userData.label||n)} · no drawable geometry in this source tree`;return;}const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),extent=Math.max(size.x,size.y,size.z,.1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(extent*.95,extent*.55,extent*.95));camera.near=Math.max(extent/10000,.0001);camera.far=extent*100;camera.updateProjectionMatrix();controls.update();updateMaterials();const glass=shownMeshes(group).filter(m=>m.userData.headerColour);const glassNote=glass.length?` · glass/Header-colour parts (${glass.length} here) draw the original stored colour and GS alpha (opacity alpha/128); the mapping is a candidate, not proven shading`:'';const r=selected.records.find(r=>String(r.record)===n);const label=group.userData.label?sceneLabel(group.userData.label):`assembly part ${n} (${r.triangles.toLocaleString()} candidate triangles)`;status.textContent=`${selected.code} · ${label} · size ${size.toArray().map(v=>v.toFixed(2)).join(' × ')} (game units) · exported source scene; runtime rendering fidelity remains under validation${glassNote}`;}
function isShown(mesh){for(let node=mesh;node;node=node.parent){if(node.visible===false)return false;}return true;}
function shownMeshes(root){const found=[];if(!root||root.visible===false)return found;root.traverse(o=>{if(o.isMesh)found.push(o);});return found;}
function updateDescription(entry){const node=document.querySelector('#source-description');if(!node)return;node.textContent=entry.game==='ford-racing-2'?'Ford Racing 2: original coordinates with candidate triangle assembly, normals and shading. Tree presets follow recovered visibility routines; live LOD and runtime fidelity remain under validation.':entry.game==='gran-turismo'?'Gran Turismo: native car and texture conversions, identified by source archive codes. Day, night and arcade exports remain separate. Retail display names and game-render fidelity are unverified.':entry.game==='redline'?'Redline: native car configurations with converted static models and embedded textures. Base and add-on variants remain separate. Names come from source configurations; game-render fidelity is unverified.':'Recovered source model; inspect its exported scenes and textures. Runtime rendering fidelity is unverified.';if(entry.claim_limits?.length)node.textContent+=' '+entry.claim_limits.join(' ');}
const index=await(await fetch('public/models.json',{cache:'no-store'})).json();
const gameSelect=document.querySelector('#game'),search=document.querySelector('#search'),sourceVariant=document.querySelector('#source-variant'),filterStatus=document.querySelector('#filter-status');
const gameNames={'ford-racing-2':'Ford Racing 2','gran-turismo':'Gran Turismo','redline':'Redline'};
for(const game of ['all',...new Set(index.cars.map(c=>c.game))])gameSelect.append(Object.assign(document.createElement('option'),{value:game,textContent:game==='all'?'All games':gameNames[game]||game}));
for(const variant of [...new Set(index.cars.map(c=>c.source_variant).filter(Boolean))])sourceVariant.append(Object.assign(document.createElement('option'),{value:variant,textContent:variant}));
let filterRevision=0;
function filterCars(literal=true,preferred=carSelect.value){filterRevision++;const previous=carSelect.value,query=literal?search.value.toLowerCase().trim():'';const cars=index.cars.filter(c=>(gameSelect.value==='all'||c.game===gameSelect.value)&&(!sourceVariant.value||c.source_variant===sourceVariant.value)&&(!query||[c.code,c.display_name||'',c.game,c.source_variant||''].join(' ').toLowerCase().includes(query)));carSelect.replaceChildren(...cars.map(c=>Object.assign(document.createElement('option'),{value:c.id,textContent:(gameNames[c.game]||c.game)+' · '+(c.display_name||c.code)})));carSelect.value=(cars.find(c=>c.id===preferred)||cars.find(c=>c.id==='ford-racing-2/GRAN_TORINO')||cars[0])?.id||'';filterStatus.textContent=`${cars.length} source models`;if(!cars.length){++requestId;pendingRequest?.abort();dispose();setLoading(false);document.querySelector('#download').removeAttribute('href');document.querySelector('#retry').hidden=true;status.textContent='No source models match these filters.';}else if(carSelect.value!==previous)loadCar();}
for(const control of [gameSelect,sourceVariant])control.addEventListener('change',()=>filterCars());search.addEventListener('input',()=>filterCars());
document.querySelector('#interpret').addEventListener('click',async()=>{const button=document.querySelector('#interpret'),revision=filterRevision,query=search.value,controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);button.disabled=true;filterStatus.textContent='Interpreting search…';try{const response=await fetch('/api/library-filter',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({query})});if(!response.ok)throw Error('Semantic search is unavailable on this server');const result=await response.json();if(revision!==filterRevision)return;if(result.status!=='ok'){filterStatus.textContent=result.message||'This search needs review; choose game and variant directly.';return;}if(![...gameSelect.options].some(o=>o.value===result.filters.game)||![...sourceVariant.options].some(o=>o.value===(result.filters.variant||'')))throw Error('The server returned an unknown filter');gameSelect.value=result.filters.game;sourceVariant.value=result.filters.variant||'';search.value='';filterCars(false);filterStatus.textContent+=' · semantic filters applied';}catch(error){if(revision!==filterRevision)return;filterStatus.textContent=error.message+'; game, variant and literal search are still available.';}finally{clearTimeout(timeout);button.disabled=false;}});
carSelect.addEventListener('change',loadCar);document.querySelector('#retry').addEventListener('click',loadCar);recordSelect.addEventListener('change',showRecord);for(const id of ['textures','sharp','wire','flip','variant'])document.querySelector('#'+id).addEventListener('change',updateMaterials);
const parameters=new URLSearchParams(location.search);if([...gameSelect.options].some(o=>o.value===parameters.get('game')))gameSelect.value=parameters.get('game');if([...sourceVariant.options].some(o=>o.value===parameters.get('variant')))sourceVariant.value=parameters.get('variant');
filterCars(true,parameters.get('car')||'');
new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}).observe(stage);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});window.__recBoot.ok();
</script></html>
